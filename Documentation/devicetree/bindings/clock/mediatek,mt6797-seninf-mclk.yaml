%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt6797-seninf-mclk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 SENINF camera sensor master clocks

maintainers:
  - George Whewell <georgerw@gmail.com>

description:
  The timing generators of the MT6797 sensor interface (SENINF) drive the
  CMMCLKn pads that clock external camera sensors. Clock specifier n
  selects the timing generator of SENINF instance n, which is 0x1000 * n
  bytes after the start of the register window.

properties:
  compatible:
    const: mediatek,mt6797-seninf-mclk

  reg:
    maxItems: 1

  clocks:
    items:
      - description: CAMTG gate, the source of the sensor clocks
      - description: SENINF register gate
      - description: CAMSYS gate

  clock-names:
    items:
      - const: camtg
      - const: seninf
      - const: camsys

  power-domains:
    maxItems: 1

  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - power-domains
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mt6797-clk.h>
    #include <dt-bindings/power/mt6797-power.h>

    clock-controller@1a040000 {
        compatible = "mediatek,mt6797-seninf-mclk";
        reg = <0x1a040000 0x2000>;
        clocks = <&camsys CLK_CAM_CAMTG>, <&camsys CLK_CAM_SENINF>,
                 <&camsys CLK_CAM_CAMSYS>;
        clock-names = "camtg", "seninf", "camsys";
        power-domains = <&scpsys MT6797_POWER_DOMAIN_ISP>;
        #clock-cells = <1>;
    };
