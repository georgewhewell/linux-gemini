%YAML 1.2
---
$id: http://devicetree.org/schemas/gnss/mediatek,mt6797-gnss.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 CONSYS GNSS function

maintainers:
  - George Whewell <georgerw@gmail.com>

description: |
  GNSS STP task 2 of the MT6797 connectivity subsystem. The parent owns
  shared power, firmware, WMT transactions and transport. The child owns
  its optional antenna LNA supply and exposes the unmodified receiver byte
  stream using the Linux GNSS character-device interface.

allOf:
  - $ref: gnss-common.yaml#

properties:
  compatible:
    const: mediatek,mt6797-gnss
  lna-supply: true

required:
  - compatible

unevaluatedProperties: false
