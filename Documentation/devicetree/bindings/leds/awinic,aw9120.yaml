%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/awinic,aw9120.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AWINIC AW9120 20-channel LED driver

maintainers:
  - George Whewell <georgerw@gmail.com>

description: |
  The AW9120 is an I2C LED driver with 20 constant-current sinks (LED1 to
  LED20). Each output has an 8-level maximum current setting from 0 to
  24.5 mA in 3.5 mA steps and 256-level PWM dimming. Outputs can be used
  individually or grouped into multicolor LEDs.

  Data sheet: AWINIC AW9120, 20 Programmable LED Driver, V1.4 (Feb. 2019).

properties:
  compatible:
    const: awinic,aw9120

  reg:
    enum: [0x2c, 0x2d]

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  enable-gpios:
    maxItems: 1
    description:
      GPIO connected to the active-low PDN (power-down) input. The pin
      holds the chip in shutdown while low. If absent, PDN must be tied
      high.

  vbat-supply:
    description: Regulator for the VBAT power input.

  vio-supply:
    description:
      Regulator for the I2C interface high level. It does not supply a pin
      of the AW9120, but the SCL, SDA and INTN pull-ups.

  interrupts:
    maxItems: 1
    description: Open-drain, active-low INTN output.

patternProperties:
  "^multi-led-[0-9]+$":
    type: object
    $ref: leds-class-multicolor.yaml#
    unevaluatedProperties: false

    properties:
      "#address-cells":
        const: 1

      "#size-cells":
        const: 0

    patternProperties:
      "^led@[0-9a-f]+$":
        type: object
        $ref: "#/$defs/channel"
        unevaluatedProperties: false

        required:
          - color

    required:
      - "#address-cells"
      - "#size-cells"

  "^led@[0-9a-f]+$":
    type: object
    $ref: "#/$defs/channel"
    unevaluatedProperties: false

$defs:
  channel:
    $ref: common.yaml#

    properties:
      reg:
        description:
          Output index. 0 to 19 select the LED1 to LED20 pins.
        minimum: 0
        maximum: 19

      led-max-microamp:
        description:
          Maximum current of the output. The current is programmed in
          3.5 mA steps.
        minimum: 3500
        maximum: 24500
        multipleOf: 3500
        default: 3500

    required:
      - reg

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        led-controller@2c {
            compatible = "awinic,aw9120";
            reg = <0x2c>;
            #address-cells = <1>;
            #size-cells = <0>;
            enable-gpios = <&pio 245 GPIO_ACTIVE_HIGH>;

            multi-led-1 {
                color = <LED_COLOR_ID_RGB>;
                function = LED_FUNCTION_INDICATOR;
                function-enumerator = <1>;
                #address-cells = <1>;
                #size-cells = <0>;

                led@0 {
                    reg = <0>;
                    color = <LED_COLOR_ID_RED>;
                    led-max-microamp = <3500>;
                };

                led@1 {
                    reg = <1>;
                    color = <LED_COLOR_ID_GREEN>;
                    led-max-microamp = <3500>;
                };

                led@2 {
                    reg = <2>;
                    color = <LED_COLOR_ID_BLUE>;
                    led-max-microamp = <3500>;
                };
            };

            led@12 {
                reg = <18>;
                color = <LED_COLOR_ID_RED>;
                function = LED_FUNCTION_CAPSLOCK;
                led-max-microamp = <7000>;
            };
        };
    };
...
