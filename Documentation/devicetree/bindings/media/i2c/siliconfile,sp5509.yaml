%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/siliconfile,sp5509.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiliconFile SP5509 CMOS image sensor

maintainers:
  - Sakari Ailus <sakari.ailus@linux.intel.com>

description: |
  The SiliconFile SP5509 is a five megapixel CMOS image sensor derived from
  the Hynix HI556 design. It provides 2592x1944 10-bit Bayer frames over a
  two-lane MIPI CSI-2 interface and is controlled over I2C.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: siliconfile,sp5509

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: clk

  dovdd-supply:
    description: Digital I/O supply, nominally 1.8 V.

  avdd-supply:
    description: Analog supply, nominally 2.8 V.

  dvdd-supply:
    description: Digital core supply, nominally 1.2 V.

  reset-gpios:
    description: Sensor reset GPIO.
    maxItems: 1

  powerdown-gpios:
    description: Sensor power-down GPIO.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2

          link-frequencies:
            items:
              - const: 440000000

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - dovdd-supply
  - avdd-supply
  - dvdd-supply
  - reset-gpios
  - powerdown-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@20 {
            compatible = "siliconfile,sp5509";
            reg = <0x20>;

            clocks = <&camera_clk>;
            clock-names = "clk";

            dovdd-supply = <&camera_dovdd>;
            avdd-supply = <&camera_avdd>;
            dvdd-supply = <&camera_dvdd>;

            reset-gpios = <&gpio0 1 GPIO_ACTIVE_LOW>;
            powerdown-gpios = <&gpio0 2 GPIO_ACTIVE_LOW>;

            port {
                sp5509_out: endpoint {
                    remote-endpoint = <&seninf_in>;
                    data-lanes = <1 2>;
                    link-frequencies = /bits/ 64 <440000000>;
                };
            };
        };
    };
...
