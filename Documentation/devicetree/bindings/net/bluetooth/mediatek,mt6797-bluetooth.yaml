%YAML 1.2
---
$id: http://devicetree.org/schemas/net/bluetooth/mediatek,mt6797-bluetooth.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 CONSYS Bluetooth function

maintainers:
  - Linux Mediatek Maintainers <linux-mediatek@lists.infradead.org>

description: |
  The Bluetooth function is an HCI consumer of its parent MT6797 CONSYS
  aggregate. The parent exclusively owns firmware, power, VCN33, BTIF and the
  multiplexed full-STP session, so this child has no duplicate resources.

allOf:
  - $ref: bluetooth-controller.yaml#

properties:
  compatible:
    const: mediatek,mt6797-bluetooth

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    bluetooth {
        compatible = "mediatek,mt6797-bluetooth";
    };
