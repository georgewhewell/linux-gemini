%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wireless/mediatek,mt6797-wifi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 Wi-Fi host interface

maintainers:
  - Julien Etienne <julien.etienne@gmail.com>

description:
  The MT6797 contains an AHB-attached SDIO-like host interface for the Wi-Fi
  function in the connectivity subsystem.  This node describes only the host
  interface aperture, its interrupt, and the Wi-Fi-specific VCN33 rail.  The
  shared connectivity processor, firmware, clocks, resets, and common rails
  belong to a separate subsystem owner.

properties:
  compatible:
    const: mediatek,mt6797-wifi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    const: hif

  vcn33-supply:
    description: Wi-Fi enable input of the shared VCN33 regulator output.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - vcn33-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    wifi@180f0000 {
        compatible = "mediatek,mt6797-wifi";
        reg = <0x180f0000 0x1100>;
        interrupts = <GIC_SPI 283 IRQ_TYPE_LEVEL_LOW>;
        interrupt-names = "hif";
        vcn33-supply = <&wifi_vcn33>;
        status = "disabled";
    };
...
