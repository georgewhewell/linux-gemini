%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wireless/mediatek,mt6797-wifi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 integrated Wi-Fi host interface

maintainers:
  - George Whewell <georgerw@gmail.com>

description: |
  MT6797 contains an AHB-attached SDIO-like PIO portal for its integrated
  GEN3 WLAN function. The Wi-Fi endpoint owns that portal, the WLAN interrupt,
  and the divided WLAN firmware image. Its parent connectivity subsystem owns
  the shared firmware, reset, clocks, power domain, STP session, shared EMI,
  and the Wi-Fi VCN33 regulator vote.

  The endpoint is instantiated only after the parent has completed its common
  patch sequence. Describing the node does not enable WLAN: it remains disabled
  unless a board overlay explicitly selects it.

properties:
  compatible:
    const: mediatek,mt6797-wifi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    const: hif

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    consys {
        #address-cells = <2>;
        #size-cells = <2>;
        ranges;

        wifi@180f0000 {
            compatible = "mediatek,mt6797-wifi";
            reg = <0 0x180f0000 0 0x1100>;
            interrupts = <GIC_SPI 283 IRQ_TYPE_LEVEL_LOW>;
            interrupt-names = "hif";
            status = "disabled";
        };
    };
...
