%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/mediatek,mt6351-fg-readonly.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6351 read-only fuel-gauge qualification

maintainers:
  - linux-mediatek@lists.infradead.org

description: |
  The MT6351 FGADC needs a write/latch/clear sequence for coherent gauge data.
  This node is an opt-in diagnostic stage that exposes only raw, direct-read
  values. It does not initialize or calibrate the fuel gauge, latch a sample,
  service its interrupts, or provide a battery capacity estimate.

properties:
  compatible:
    const: mediatek,mt6351-fg-readonly

required:
  - compatible

additionalProperties: false

examples:
  - |
    pmic {
      fuel-gauge {
        compatible = "mediatek,mt6351-fg-readonly";
      };
    };
