%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/mediatek,mt6351-fgadc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6351 FGADC battery monitor

maintainers:
  - linux-mediatek@lists.infradead.org

description: |
  The MT6351 fuel-gauge ADC reports calibrated current and a coulomb counter.
  Its hardware configuration and calibration are board-specific.  The driver
  does not start the hardware unless this node is enabled and explicitly grants
  ownership with mediatek,initialize-fgadc.  The properties below are required
  so that Linux never substitutes a battery or factory calibration value.

allOf:
  - $ref: power-supply.yaml#
  - if:
      required: [mediatek,capacity-model]
    then:
      required:
        - monitored-battery
        - power-supplies
        - mediatek,resistance-table-0

properties:
  compatible:
    const: mediatek,mt6351-fgadc

  monitored-battery:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Optional battery characteristics for the monitored pack.

  mediatek,capacity-model:
    $ref: /schemas/types.yaml#/definitions/int32-matrix
    minItems: 1
    maxItems: 4
    items:
      items:
        - minimum: -50
          maximum: 100
        - minimum: 100000
          maximum: 100000000
    description: |
      Optional software fuel-gauge model. Each pair gives temperature in
      degrees Celsius and model full charge (Qmax) in microamp-hours. Pairs
      must be in increasing temperature order. These are model estimates,
      not measured aged capacity or the pack's design capacity. Each pair
      requires a resistance table at the same index and a corresponding
      OCV table in monitored-battery at exactly that temperature. With all
      inputs present the driver estimates state of charge using compensated
      voltage and coulomb-counter changes, without changing charger policy.

  power-supplies:
    maxItems: 1
    description: |
      Optional charger for the monitored battery. It must report battery-side
      voltage, battery thermistor temperature and charging status through its
      power-supply interface. These measurements supplement the FGADC current and coulomb
      counter; no charger policy is changed by the battery monitor.

  mediatek,initialize-fgadc:
    description: |
      Permit Linux to enable the two FGADC clocks, program the initial FGADC
      control byte, and select the oversampling ratio.  The driver snapshots
      and restores those fields on probe failure and removal.  It does not
      reset the hardware coulomb counter.
    type: boolean

  vdda-supply:
    description:
      MT6351 VA18 LDO, which powers the FGADC analog front end. Without it
      the converter never latches a sample.

  mediatek,fgadc-init-control:
    description: |
      Lower FGADC_CON0 byte to program before setting FG_ON. Bit 0 must be
      clear; the driver sets it only after the initial value is installed.
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 254

  mediatek,fgadc-osr:
    description: FGADC oversampling ratio field programmed in FGADC_CON15.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 15

  mediatek,fg-resistance-milliohm:
    description: Board current-sense resistance in milliohms.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1

  mediatek,fg-board-base:
    description: Board current-calibration base factor.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1

  mediatek,fg-board-slope:
    description: Board current-calibration slope factor.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1

  mediatek,car-tune:
    description: Factory coulomb/current calibration, with 100 meaning unity.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1

  mediatek,fg-trim-permille:
    description: PMIC current/coulomb trim factor, with 1000 meaning unity.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1

patternProperties:
  '^mediatek,resistance-table-[0-3]$':
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    minItems: 2
    maxItems: 100
    items:
      items:
        - minimum: 2000000
          maximum: 5000000
        - minimum: 1
          maximum: 20000000
    description: |
      Pairs of zero-current battery voltage in microvolts and internal
      resistance in microohms, ordered by strictly decreasing voltage.
      The index selects the temperature in mediatek,capacity-model. The
      resistance model must describe the battery measured by power-supplies.

required:
  - compatible
  - mediatek,initialize-fgadc
  - vdda-supply
  - mediatek,fgadc-init-control
  - mediatek,fgadc-osr
  - mediatek,fg-resistance-milliohm
  - mediatek,fg-board-base
  - mediatek,fg-board-slope
  - mediatek,car-tune
  - mediatek,fg-trim-permille

additionalProperties: false
