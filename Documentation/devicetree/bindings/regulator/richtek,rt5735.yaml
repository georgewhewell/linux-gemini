%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/richtek,rt5735.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Richtek RT5735 Step-Down Buck Converter

description: |
  The RT5735 is an I2C-controlled buck converter. This binding describes the
  VSEL0 output used by the MT6797 Gemini GPU. The VSEL0 voltage selector has
  128 linear steps from 600 mV to 1.39375 V in 6.25 mV increments.

allOf:
  - $ref: regulator.yaml#

properties:
  compatible:
    const: richtek,rt5735

  reg:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      regulator@1c {
        compatible = "richtek,rt5735";
        reg = <0x1c>;
        regulator-name = "vgpu";
        regulator-min-microvolt = <600000>;
        regulator-max-microvolt = <1393750>;
        regulator-boot-on;
      };
    };
