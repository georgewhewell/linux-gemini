%YAML 1.2
---
$id: http://devicetree.org/schemas/remoteproc/mediatek,mt6797-md1.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 MD1 modem subsystem

maintainers:
  - George Whewell <georgerw@gmail.com>

description:
  The MT6797 contains an integrated modem processor.  The application
  processor communicates with it through CLDMA and CCIF register blocks.
  The modem also owns private memory and a shared-memory region.  This
  binding describes those resources only; it does not define a firmware or
  power-on ABI.

$nodename:
  pattern: "^remoteproc@[0-9a-f]+$"

properties:
  compatible:
    const: mediatek,mt6797-md1

  reg:
    items:
      - description: Application-processor CLDMA always-on registers
      - description: Modem CLDMA always-on registers
      - description: Application-processor CLDMA power-down registers
      - description: Modem CLDMA power-down registers
      - description: Application-processor CCIF registers
      - description: Modem CCIF registers

  reg-names:
    items:
      - const: ap-ao
      - const: md-ao
      - const: ap-pdn
      - const: md-pdn
      - const: ap-ccif
      - const: md-ccif

  interrupts:
    items:
      - description: CLDMA interrupt
      - description: CCIF interrupt
      - description: Modem watchdog interrupt

  interrupt-names:
    items:
      - const: cldma
      - const: ccif
      - const: wdt

  clocks:
    items:
      - description: Application-processor CCIF interface clock
      - description: Modem CCIF interface clock

  clock-names:
    items:
      - const: ccif-ap
      - const: ccif-md

  resets:
    items:
      - description: CLDMA power-down register-domain reset
      - description: CLDMA always-on register-domain reset

  reset-names:
    items:
      - const: cldma-pdn
      - const: cldma-ao

  mediatek,spm:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the MT6797 SPM syscon. The ownership core only observes the
      two read-only power-status registers; this property does not make MD1 a
      generic power-domain consumer or authorize a power-state transition.

  memory-region:
    description:
      Reserved memory for the modem and for application-processor/modem
      communication.  Both regions are required before the modem can be
      enabled.
    minItems: 2
    maxItems: 2

  memory-region-names:
    items:
      - const: md1
      - const: shared

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - mediatek,spm

dependencies:
  memory-region: [memory-region-names]
  memory-region-names: [memory-region]

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mt6797-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/reset/mt6797-resets.h>

    remoteproc@10014000 {
        compatible = "mediatek,mt6797-md1";
        reg = <0x10014000 0x1e00>,
              <0x10015000 0x1e00>,
              <0x10219000 0x1e00>,
              <0x1021a000 0x1e00>,
              <0x10209000 0x1000>,
              <0x1020a000 0x1000>;
        reg-names = "ap-ao", "md-ao", "ap-pdn", "md-pdn",
                    "ap-ccif", "md-ccif";
        interrupts = <GIC_SPI 265 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 147 IRQ_TYPE_LEVEL_LOW>,
                     <GIC_SPI 266 IRQ_TYPE_EDGE_FALLING>;
        interrupt-names = "cldma", "ccif", "wdt";
        clocks = <&infracfg CLK_INFRA_CCIF_AP>,
                 <&infracfg CLK_INFRA_CCIF_MD>;
        clock-names = "ccif-ap", "ccif-md";
        resets = <&infracfg MT6797_INFRA_CLDMA_RST>,
                 <&infracfg MT6797_INFRA_CLDMA_AO_RST>;
        reset-names = "cldma-pdn", "cldma-ao";
        mediatek,spm = <&scpsys>;
        status = "disabled";
    };

...
