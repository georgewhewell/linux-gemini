%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6797-a72-power.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 Cortex-A72 cluster power coordination

maintainers:
  - George Whewell <georgerw@gmail.com>

description: |
  The MT6797 Cortex-A72 cluster needs its external processor regulator, SRAM
  LDO, SPM isolation, TOPRGU reset, and MCUCFG controls sequenced before PSCI
  CPU_ON. The first implementation deliberately provides no CPU_OFF path.

properties:
  compatible:
    const: mediatek,mt6797-a72-power

  reg:
    maxItems: 1
    description: MCUCFG2 registers for the Cortex-A72 cluster.

  mediatek,spm:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the MT6797 SPM power controller.

  cpus:
    minItems: 2
    maxItems: 2
    description: Cortex-A72 CPUs sharing this power path, CPU8 first.

  vproc-supply:
    description: External DA9214 BUCKB supply for the Cortex-A72 cluster.

  resets:
    maxItems: 1

  reset-names:
    const: pwrap

  mediatek,allow-cpu9:
    type: boolean
    description: Allow CPU9 after the separately gated coherency test passes.

required:
  - compatible
  - reg
  - mediatek,spm
  - cpus
  - vproc-supply
  - resets
  - reset-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/reset/mt6797-resets.h>

    power-controller@10222000 {
        compatible = "mediatek,mt6797-a72-power";
        reg = <0x10222000 0x1000>;
        mediatek,spm = <&scpsys>;
        cpus = <&cpu8>, <&cpu9>;
        vproc-supply = <&da9214_buckb>;
        resets = <&watchdog MT6797_TOPRGU_PWRAP_SPI_CTL_RST>;
        reset-names = "pwrap";
    };
...
