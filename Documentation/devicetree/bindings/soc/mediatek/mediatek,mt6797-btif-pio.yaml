%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6797-btif-pio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 BTIF PIO transport

maintainers:
  - George Whewell <georgerw@gmail.com>

description: |
  PIO-only transport for the MT6797 BTIF core. It uses the single BTIF core
  register window, its level-low interrupt, and CLK_INFRA_BTIF. The provider
  deliberately has no APDMA resource or clock; CONSYS lifecycle and firmware
  ownership belong to its consumers.

properties:
  compatible:
    const: mediatek,mt6797-btif-pio

  reg:
    maxItems: 1
    description: The BTIF core window at 0x1100c000, sized 0x1000.

  interrupts:
    maxItems: 1
    description: The BTIF core GIC SPI 130, level-low.

  clocks:
    maxItems: 1
    description: The MT6797 infrasys CLK_INFRA_BTIF clock.

  clock-names:
    const: btifc

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mt6797-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    / {
        #address-cells = <2>;
        #size-cells = <2>;

        gic: interrupt-controller {
            interrupt-controller;
            #interrupt-cells = <3>;
        };

        btif_pio: serial@1100c000 {
            compatible = "mediatek,mt6797-btif-pio";
            reg = <0 0x1100c000 0 0x1000>;
            interrupts = <GIC_SPI 130 IRQ_TYPE_LEVEL_LOW>;
            interrupt-parent = <&gic>;
            clocks = <&infrasys CLK_INFRA_BTIF>;
            clock-names = "btifc";
            status = "disabled";
        };
    };
...
