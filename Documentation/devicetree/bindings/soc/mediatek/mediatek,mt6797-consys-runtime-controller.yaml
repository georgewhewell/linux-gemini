%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6797-consys-runtime-controller.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 gated CONSYS STP-bootstrap controller

maintainers:
  - George Whewell <georgerw@gmail.com>

description: |
  This is a deliberately separate, one-shot consumer of the MT6797 CONSYS
  runtime and BTIF PIO platform experiments. It creates managed supplier
  links, then remains dormant until an in-kernel caller invokes its explicitly
  gated start operation. That operation owns only the documented mandatory
  STP query-default, set-full, host full-STP handoff, 10 ms delay, and
  query-full verification sequence.

  Keep this node disabled in the shipped Gemini DT. A hand-authored overlay
  must enable it, set mediatek,experimental-bootstrap, enable each referenced
  provider's independent gates, and set the controller boot parameter. This
  binding does not establish clock, pad, reset-release, AFE, firmware-patch,
  or radio-function ownership. The controller registers no GNSS, HCI, Wi-Fi,
  FM, or userspace endpoint.

properties:
  compatible:
    const: mediatek,mt6797-consys-runtime-controller

  mediatek,runtime-provider:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: |
      A separately enabled mediatek,mt6797-consys-runtime provider holding the
      exclusive lifecycle lease through its bounded identity prefix.

  mediatek,btif-provider:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: |
      A separately enabled mediatek,mt6797-btif-pio platform adapter with its
      BTIF IRQ registered but disabled.

  mediatek,experimental-bootstrap:
    type: boolean
    description: |
      Explicitly permit this dormant coordinator to bind when its independent
      default-false boot parameter is also supplied. It does not itself start
      the handover.

required:
  - compatible
  - mediatek,runtime-provider
  - mediatek,btif-provider
  - mediatek,experimental-bootstrap

additionalProperties: false

examples:
  - |
    consys-stp-bootstrap {
        compatible = "mediatek,mt6797-consys-runtime-controller";
        mediatek,runtime-provider = <&consys_runtime>;
        mediatek,btif-provider = <&btif_pio>;
        mediatek,experimental-bootstrap;
        status = "disabled";
    };
...
