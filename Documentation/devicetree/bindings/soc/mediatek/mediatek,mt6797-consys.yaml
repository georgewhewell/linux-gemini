%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6797-consys.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 connectivity subsystem

maintainers:
  - George Whewell <georgerw@gmail.com>

description: |
  The MT6797 connectivity subsystem contains the shared control resources for
  Bluetooth, Wi-Fi, GNSS, and FM. This binding initially describes an
  inventory-only platform device. Its driver acquires and validates resource
  metadata, but does not map or access registers; enable or disable a clock,
  regulator, reset, interrupt, or power domain; access firmware; or map the
  shared reserved memory.

  A separately named, explicitly opt-in identity experiment may acquire the
  MT6797 CONN power domain, read chip ID 0x0279 while CONMCU reset remains
  asserted, and release its votes again. It never configures AFE, firmware, or
  a radio. Its node must remain disabled in the shipped board DT; activation
  requires a deliberate DT overlay and a boot-time kernel parameter.

properties:
  compatible:
    enum:
      - mediatek,mt6797-consys
      - mediatek,mt6797-consys-identity

  reg:
    items:
      - description: Connectivity MCU configuration registers.
      - description: AP reset generator registers.
      - description: Top clock generator and connectivity remap registers.
      - description: System power manager registers.

  reg-names:
    items:
      - const: mcu
      - const: ap-rgu
      - const: topckgen
      - const: spm

  interrupts:
    minItems: 2
    maxItems: 2

  interrupt-names:
    items:
      - const: bgf
      - const: wdt

  resets:
    maxItems: 1

  reset-names:
    const: conn-mcu

  clocks:
    maxItems: 1

  clock-names:
    const: conn

  mediatek,conn-power-domain:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: |
      Deferred CONN domain attachment for the identity experiment. Unlike the
      standard power-domains property this is not attached by the device core;
      the driver attaches it only after its rail, reset, and PWRON prefix.

  vcn18-supply:
    description: Shared 1.8 V connectivity supply.

  vcn28-supply:
    description: Shared 2.8 V connectivity supply.

  vcn33-bt-supply:
    description: Bluetooth-specific 3.3 V connectivity supply.

  vcn33-wifi-supply:
    description: Wi-Fi-specific 3.3 V connectivity supply.

  memory-region:
    maxItems: 1
    description: |
      The 2 MiB, 2 MiB-aligned, no-map CONSYS shared-memory reservation.

  memory-region-names:
    const: shared

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - resets
  - reset-names
  - memory-region
  - memory-region-names

allOf:
  - if:
      properties:
        compatible:
          const: mediatek,mt6797-consys-identity
    then:
      required:
        - mediatek,conn-power-domain
        - vcn18-supply
        - vcn28-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/reset/mt6797-resets.h>

    / {
        #address-cells = <2>;
        #size-cells = <2>;

        gic: interrupt-controller {
            interrupt-controller;
            #interrupt-cells = <3>;
        };

        consys@18070000 {
            compatible = "mediatek,mt6797-consys";
            reg = <0 0x18070000 0 0x200>,
                  <0 0x10007000 0 0x100>,
                  <0 0x10000000 0 0x2000>,
                  <0 0x10006000 0 0x1000>;
            reg-names = "mcu", "ap-rgu", "topckgen", "spm";
            interrupts = <GIC_SPI 284 IRQ_TYPE_LEVEL_LOW>,
                         <GIC_SPI 285 IRQ_TYPE_LEVEL_LOW>;
            interrupt-names = "bgf", "wdt";
            interrupt-parent = <&gic>;
            resets = <&watchdog MT6797_TOPRGU_CONMCU_SW_RST>;
            reset-names = "conn-mcu";
            memory-region = <&consys_reserved_memory>;
            memory-region-names = "shared";
            status = "disabled";
        };
    };
...
