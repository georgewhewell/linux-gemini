%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6797-md1-emi-mpu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 MD1 one-way secure EMI MPU provider

maintainers:
  - Gemini Mainline Experiment <gemini-mainline@example.invalid>

description: |
  The MT6797 vendor MD1 CCCI path issues the secure-monitor EMI MPU SET call
  for regions 11 and 7 before CCIF, then regions 12, 13, 10 and 14 after
  reset-held power. Vendor supplies no MD1 readback or inverse. The provider
  captures every SET return status and makes any attempted error boot-fatal.
  This node must remain disabled in the shipped board DT. Enabling it also
  needs its explicit read-only module parameter; probe itself issues no SMC.
  It has no modem firmware, boot-vector, reset, power, CCIF or clock control.

properties:
  compatible:
    const: mediatek,mt6797-md1-emi-mpu

  mediatek,experimental-md1-emi-mpu:
    type: boolean
    description: Explicitly permit this one-way provider to probe.

required:
  - compatible

additionalProperties: false
...
