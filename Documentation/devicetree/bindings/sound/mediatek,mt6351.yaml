%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mediatek,mt6351.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6351 audio codec

maintainers:
  - Tzung-Bi Shih <tzungbi@chromium.org>
  - Jiaxin Yu <jiaxin.yu@mediatek.com>

description:
  The MT6351 codec is an MFD child of the MT6351 PMIC. Communication with the
  SoC uses the MediaTek PMIC wrapper owned by the parent PMIC device.

properties:
  compatible:
    const: mediatek,mt6351-sound

required:
  - compatible

additionalProperties: false

examples:
  - |
    pmic {
        audio-codec {
            compatible = "mediatek,mt6351-sound";
        };
    };

...
