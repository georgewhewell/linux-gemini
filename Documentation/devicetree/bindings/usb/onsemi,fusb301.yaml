%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/onsemi,fusb301.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: onsemi FUSB301 autonomous USB Type-C controller

description: |
  The onsemi FUSB301 and FUSB301A are autonomous USB Type-C 1.1
  controllers. They detect source/sink, dual-role, accessory, VBUS, BC
  current, and CC orientation, and report events through an active-low
  interrupt. They do not implement USB Power Delivery or TCPCI.

maintainers:
  - Julien Etienne <julien.etienne@gmail.com>

properties:
  compatible:
    enum:
      - onsemi,fusb301
      - onsemi,fusb301a

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vbus-supply:
    description:
      Regulator supplying connector VBUS when the port is acting as a source.

  connector:
    type: object
    $ref: ../connector/usb-connector.yaml#
    unevaluatedProperties: false
    description:
      The managed USB Type-C connector. FUSB301 does not support Power
      Delivery, so the connector must set pd-disable.
    properties:
      compatible:
        const: usb-c-connector
    required:
      - pd-disable

required:
  - compatible
  - reg
  - interrupts
  - connector

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      typec@25 {
        compatible = "onsemi,fusb301";
        reg = <0x25>;
        interrupt-parent = <&gpio0>;
        interrupts = <4 IRQ_TYPE_LEVEL_LOW>;

        connector {
          compatible = "usb-c-connector";
          label = "USB-C";
          power-role = "dual";
          data-role = "dual";
          typec-power-opmode = "default";
          pd-disable;
        };
      };
    };
